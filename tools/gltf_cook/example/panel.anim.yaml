# Animations of panel.gltf (../animated_materials.md, "Model animations"): which frames
# of the examplepanel library its materials play, and when.
# aeron_gltf_cook --animations merges them into the model.
version: 1
materials:
  Lights:
    flipbooks:
      # Always: lamps 0 and 2 amber, then 1 and 3 green, half a second each.
      - { state: always, layer: emissive, mode: loop, library: examplepanel, emissiveStrength: 3,
          frames: [[lights_0, 0.5], [lights_1, 0.5]] }
  Screen:
    flipbooks:
      # While the player has a target: blue, then red; else the black glass.
      - { state: target, layer: baseColor, mode: loop, library: examplepanel,
          frames: [[screen_a, 0.5], [screen_b, 0.5]] }
