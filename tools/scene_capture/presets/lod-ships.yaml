# Levels of detail test scene, written by lod_ships_scene.py. Rows from the
# top: tiefighter, tieinterceptor, xwing, ywing, awing, assaultgunboat. From
# left to right, each craft's radius on screen is 60, 30, 15, 8, 4, 2.5
# pixels. Behind them, the lit hull of a Super Star Destroyer 7 km away. Set
# asset_root to the folder holding mod/flight/models with the TFTC-R models.
width: 2560
height: 1440
frames: 1
fps: 60
pan_degrees_per_second: 0
pan_direction_degrees: 0
shutter: 0.5
quality: 0
reference_samples: 0
msaa_samples: 4
cull: back
bloom:
  intensity: 0.15
  kernel: 4
tonemap: agx
output_dir: captures/lod-ships
asset_root: .
models:
  - mod/flight/models/superstardestroyertftc.glb
  - mod/flight/models/tiefighter.glb
  - mod/flight/models/tieinterceptor.glb
  - mod/flight/models/xwing.glb
  - mod/flight/models/ywing.glb
  - mod/flight/models/awing.glb
  - mod/flight/models/assaultgunboat.glb
game_scene:
  defaults: aeron/config/scene3d_defaults.yaml
  sun_direction: [0.35,-0.45,-0.82]
  sun_color: [2.513, 2.513, 2.513]
  ambient: 0.08
  small_objects:
    prepass_min_size: 2.5
    draw_min_size: 2.0
    shadow_min_size: 4.0
