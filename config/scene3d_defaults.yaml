ssao:
  quality: 2
  intensity: 1.0
  power: 2.0
  radius_view: 2048.0
  bias_view: 0.0
  direct: 1.0
  debug_viz: false
  min_screen_frac: 0.0
  max_screen_frac: 0.1
  sample_jitter: 0.2

shadows:
  mode: pcf
  atlas_size: 4096
  cascade_count: 4
  fit_mode: scene_dependent
  max_distance: 262144.0
  split_lambda: 0.8
  explicit_splits: true
  split_1: 0.005
  split_2: 0.035
  split_3: 0.180
  light_angular_radius_degrees: 0.6
  max_filter_radius: 8.0
  pcss_min_filter_radius: 0.75
  normal_bias_texels: 2.0
  depth_bias_texels: 1.0
  transition_fraction: 0.10
  distance_fade_fraction: 0.10
  debug_cascades: false
  # Camera distance, in metres, served by a finer tile of the receiver-local
  # map (the cockpit's own shadows near the eye); 0 = a single tile.
  receiver_local_near_distance_m: 1.5

tonemap:
  operator: agx
  agx_look: punchy
  agx_eotf_exponent: 2.2
  agx_punchy_power: 1.1
  agx_punchy_saturation: 1.3
  # The Punchy saturation of very bright pixels (emitters such as laser
  # bolts, explosions and engine glows), which AgX takes toward white. It
  # ramps from agx_punchy_saturation to agx_highlight_saturation between
  # these EV of scene luminance (0 = white).
  agx_highlight_saturation: 2.5
  agx_highlight_ev_start: -2.0
  agx_highlight_ev_end: 2.0
  # How much of these pixels keeps its hue (0 to 1), reached at
  # agx_highlight_ev_end over the same ramp: the brightest channel goes
  # through the AgX curve, and the others keep their ratio to it.
  agx_highlight_hue: 0.6
  aces_pre_exposure: 1.6
